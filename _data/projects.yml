# Projects, software, datasets & tutorials
# ------------------------------------------------------------------
# This file drives BOTH the "Featured work" cards on the homepage and
# the full /projects/ page. To add a project, copy a block and edit it.
#
#   title     : card title
#   category  : one of the keys in `groups` below
#   blurb     : one or two sentences (keep it short — ~25 words)
#   image     : path under /images/projects/ (optional; a gradient tile is used if omitted)
#   fit       : "contain" (diagrams — no cropping) or "top" (screenshots — crop from the top) (optional)
#   featured  : true → also shown on the homepage (keep to 4)
#   date      : YYYY-MM — newest first within each group
#   tags      : short keywords (optional)
#   links     : list of {label, url}; the first link is where the card itself points
#   compact   : true → rendered as a small text tile (used for the MCP servers)
# ------------------------------------------------------------------

groups:
  - key: agents
    title: "Ecosystem for trustworthy agentic AI"
    kicker: "Agentic AI"
    blurb: "Open MCP servers that wrap established physics codes as tools, so agents compute answers instead of guessing them, plus the client that runs them on laptops and supercomputers."
    servers_title: "MCP servers"
  - key: data
    title: "Datasets & simulations"
    blurb: "Synthetic skies for current and upcoming surveys."
  - key: emulators
    title: "Emulators"
    blurb: "Fast, uncertainty-aware surrogates for expensive cosmological simulations."
  - key: tutorials
    title: "Tutorials"
    blurb: "Hands-on material for building scientific agents."

items:
  - title: "HEP-Genesis Agent"
